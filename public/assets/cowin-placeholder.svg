<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">COWIN product image placeholder</title>
  <desc id="description">A neutral COWIN branded panel used where an approved product photograph is not yet available.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f2"/>
      <stop offset="1" stop-color="#d8dddf"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".52"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#surface)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <path d="M0 720 1200 390v510H0Z" fill="#151719"/>
  <path d="M0 720 1200 390" fill="none" stroke="#f15a24" stroke-width="18"/>
  <text x="84" y="168" fill="#151719" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="-6">COWIN</text>
  <text x="86" y="226" fill="#5f6468" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="5">PRODUCT VISUAL PENDING</text>
  <text x="84" y="820" fill="#eef1f2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">APPROVED PRODUCT IMAGE COMING SOON</text>
</svg>
